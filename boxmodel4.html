<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델4</title>
    <style>
    *{padding: 0px; margin: 0;}
        .box{width: 1000px; height: 300px;
            border: 5px solid #000;
            margin: auto; display: flex; gap: 20px;}
        .box div{width: 235px; height: 300px;
                background-color: #f0f8ff;}
        ul{width: 1000px;height: 300px;
        border: 5px solid #000;
        margin: auto; list-style: none;
        display: flex; gap: 20px;}
        ul li{width: 235px; height: 300px;
            background-color: #ffc0cb;}
    </style>
</head>
<body>
    <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>

    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>
