<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아산병원</title>
    
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>

    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="header">
        <button><img src="./images/bg_header_lnb.png" alt=""></button>
        <h1> <a href="./index.html"><img src="./images/logo.png" alt=""></a></h1>
        <button><img src="./images/img_topSerch.png" alt=""></button>
    </div>
    <!-- Slider main container -->
<div class="swiper">
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide"><img src="./images/1.png" alt="메인배너"></div>
    <div class="swiper-slide"><img src="./images/2.png" alt="2번째 배너"></div>
    <div class="swiper-slide"><img src="./images/333.jpg" alt="3번째 배너"></div>
  </div>
  <!-- If we need pagination -->
  <div class="swiper-pagination"></div>

  <!-- If we need navigation buttons -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>

  <!-- If we need scrollbar -->
  <!-- <div class="swiper-scrollbar"></div>
</div> -->


    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./js/main.js">
    </script>
</body>
</html>
