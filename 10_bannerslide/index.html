<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>설화수 추천</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- 내가 작성한 CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- ========================================
         추천 제품 배너 섹션
    ========================================= -->
    <section class="recommend">

        <div class="inner">

            <!-- 섹션 제목 -->
            <h2>설화수 추천</h2>


            <!-- ========================================
                 Swiper 영역
            ========================================= -->
            <div class="swiper recommend-swiper">

                <div class="swiper-wrapper">


                    <!-- ==================================
                         SLIDE 01
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img01"></div>

                        <div class="product-info">
                            <h3>탄력크림 EX</h3>
                            <p>Essential Firming Cream EX</p>
                            <strong>100,000원</strong>
                        </div>

                    </div>


                    <!-- ==================================
                         SLIDE 02
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img02"></div>

                        <div class="product-info">
                            <h3>자정미백코렉터</h3>
                            <p>Lumiwise Discoloration Corrector</p>
                            <strong>150,000원</strong>
                        </div>

                    </div>


                    <!-- ==================================
                         SLIDE 03
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img03"></div>

                        <div class="product-info">
                            <h3>퍼펙팅 쿠션 에어리</h3>
                            <p>Perfecting Cushion Airy</p>
                            <strong>89,000원</strong>
                        </div>

                    </div>


                    <!-- ==================================
                         SLIDE 04
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img04"></div>

                        <div class="product-info">
                            <h3>윤조아이세럼</h3>
                            <p>First Care Activating Serum</p>
                            <strong>115,000원</strong>
                        </div>

                    </div>


                    <!-- ==================================
                         SLIDE 05
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img05"></div>

                        <div class="product-info">
                            <h3>여윤팩</h3>
                            <p>Concentrated Ginseng Renewing Cream</p>
                            <strong>70,000원</strong>
                        </div>

                    </div>


                    <!-- ==================================
                         SLIDE 06
                    ================================== -->
                    <div class="swiper-slide">

                        <div class="product-img img06"></div>

                        <div class="product-info">
                            <h3>순행클렌징폼</h3>
                            <p>Gentle Cleansing Foam</p>
                            <strong>42,000원</strong>
                        </div>

                    </div>

                </div>


                <!-- ==================================
                     좌우 버튼
                ================================== -->

              <button class="swiper-button-prev">
    <!-- 왼쪽 화살표 아이콘 -->
    <img src="./images/newsulwhasoo_main_arr_l_220902.png" alt="이전">
</button>

<button class="swiper-button-next">
    <!-- 오른쪽 화살표 아이콘 -->
    <img src="./images/newsulwhasoo_main_arr_r_220902.png" alt="다음">
</button>
            </div>


            <!-- ========================================
                 하단 진행바 + 일시정지/재생
            ========================================= -->
            <div class="slide-control">

                <!-- 진행 막대 -->
                <div class="progress">
                    <span class="progress-bar"></span>
                </div>

                <!-- 일시정지 / 재생 버튼 -->
                <button class="pause-btn">

    <img class="pause-icon" src="./images/jung.svg" alt="일시정지">

    <img class="play-icon" src="./images/jae.svg" alt="재생">

</button>

            </div>

        </div>

    </section>


    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 내가 작성한 JS -->
    <script src="./js/script.js"></script>

</body>
</html>
