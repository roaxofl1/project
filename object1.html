<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체데이터</title>
</head>
<body>
    <script>
        // 객체 데이터 선언하는 방법
        // 여러개의 데이터를 key값과 value의 쌍으로 저장하는 기능

        let jumsu = [100,90,80,70]
        document.write(jumsu[2] + "<br>")
        document.write(`국어 점수 = ${jumsu[0]}<br>`)
        document.write(`영어 점수 = ${jumsu[1]}<br>`)
        document.write(`수학 점수 = ${jumsu[2]}<br>`)
        document.write(`과학 점수 = ${jumsu[3]}<br>`)

        document.write("<hr>")

        let score = [{
            no:1,
            name:"홍길동",
            kor:100,
            eng:90,
            mat:80,
            sci:70
        },
        {
            no:2,
            name:"김놀부",
            kor:100,
            eng:90,
            mat:80,
            sci:70
        }]

        document.write(`번호 ${score.no}<br>`)
        document.write(`이름 ${score.name}<br>`)
        document.write(`국어 점수 = ${score.kor}<br>`)
        document.write(`영어 점수 = ${score.eng}<br>`)
        document.write(`수학 점수 = ${score.mat}<br>`)
        document.write(`과학 점수 = ${score.sci}<br>`)

        // 객체 선언
        const car={
            color:"검정",
            cc:3000,
            make:"현대 자동차"
        }
        document.write("<hr>")
        document.write(`색상=${car.color}<br>`)
        document.write(`배기량=${car.cc}<br>`)
        document.write(`제조사=${car.make}<br>`)

        const sungjuck={
            kor:100,
            eng:90,
            mat:80,
            sci:70,
        }
        document.write("<hr>")
        document.write(`국어=${sungjuck["kor"]}<br>`)
        document.write(`영어=${sungjuck["eng"]}<br>`)
        document.write(`국어=${sungjuck["mat"]}<br>`)
        document.write(`국어=${sungjuck["sci"]}<br>`)
    </script>
</body>
</html>
