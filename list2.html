<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화</title>
    <style>
        ol{list-style: upper-roman;}
        ol li ul li{list-style: square;}
        ol li ol li{list-style: number;}

    </style>
</head>
<body>
    <h2>목록을 나타내는 리스트 태그</h2>
    <ol>
        <li>액션
            <ul>
                <li>어벤져스</li>
                <li>분노의 질주</li>
                <li>옹박</li>
                <li>닌자 어쌔신</li>
            </ul>
        </li>
        <li>스릴러
            <ol>
                <li>살인의 추억</li>
                <li>올드보이</li>
                <li>숨바꼭질</li>
                <li>이웃사람</li>
            </ol>
        </li>
    </ol>

</body>
</html>
