<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambak Onboarding 03</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:#fff;
}

.wrap{
    width:100%;
    max-width:390px;
    min-height:100vh;
    margin:0 auto;
    padding:70px 24px 32px;
    display:flex;
    flex-direction:column;
}

/* 제목 */

.title{
    margin-top:5px;
}

.title h1{
    font-size:19px;
    font-weight:600;
    color:#A8B5DA;
    line-height:1.55;
}

.title h1 strong{
    display:block;
    font-size:28px;
    font-weight:700;
    color:#30467F;
}

.title h1 span{
    color:#8098D4;
}

/* 설명 */

.title p{
    margin-top:28px;
    font-size:16px;
    line-height:1.7;
    color:#A8B5DA;
    font-weight:500;
}

/* 메인 이미지 */

.visual{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    margin-top:20px;
}

.visual img{
    width:100%;
    max-width:330px;
    display:block;
}

/* 페이지 인디케이터 */

.page{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:30px 0 34px;
}

.page span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#D9DCE6;
}

.page span:nth-child(3){
    background:#5A74C8;
}

/* 버튼 */

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#5A74C8;
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#4965BF;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="title">

        <h1>
            일상이 바쁠땐 실시간
            <strong>
                라이브로 대리만족 <span>하세요</span>
            </strong>
        </h1>

        <p>
            라이브로 나를 뽐내고 시청자들과 소통하는<br>
            즐거움!
        </p>

    </div>

    <div class="visual">
        <img src="./work 3 ill .svg" alt="온보딩3">
    </div>

    <div class="page">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <a href="./login_.html"><button>시작하기</button></a>

</div>
<script>

window.onload = function () {

    setTimeout(function () {

        window.location.href = "login_.html";

    }, 3000);

};

</script>
</body>
</html>
