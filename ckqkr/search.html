<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검색결과</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Pretendard,sans-serif}
body{background:#eee;display:flex;justify-content:center}
.app{width:390px;height:100svh;background:#fff;overflow-y:auto}
.header{position:sticky;top:0;height:56px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:center;z-index:10}
.header h1{font-size:22px}
.back{position:absolute;left:18px;background:none;border:none}
.back img{width:24px}
.list{padding-bottom:80px}
.item{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid #efefef;position:relative}
.thumb{width:100px;height:100px;border-radius:10px;object-fit:cover}
.info{flex:1}
.title{font-size:18px;font-weight:700;margin-bottom:4px}
.addr{font-size:14px;color:#555;line-height:1.4}
.tags{display:flex;gap:6px;margin-top:10px}
.tag{background:#5d74bc;color:#fff;font-size:12px;padding:5px 10px;border-radius:20px}
.bookmark{position:absolute;right:20px;top:20px;width:22px}
.distance{position:absolute;right:20px;bottom:26px;color:#5671bd;font-size:18px;font-weight:600}
nav{position:sticky;bottom:0;height:66px;border-top:1px solid #ddd;background:#fff;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{text-decoration:none;color:#111;font-size:12px;display:flex;flex-direction:column;justify-content:center;align-items:center}
nav img{width:24px;margin-bottom:4px}
.active{color:#5671bd;font-weight:700}
</style>
</head>
<body>
