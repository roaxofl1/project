<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambak Onboarding 02</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:#fff;
}

.wrap{
    width:100%;
    max-width:390px;
    min-height:100vh;
    margin:0 auto;
    padding:70px 24px 32px;
    display:flex;
    flex-direction:column;
}

/* 제목 */

.title{
    margin-top:145px;
    text-align:center;
}

.title h1{
    font-size:18px;
    font-weight:600;
    color:#A8B5DA;
    line-height:1.6;
}

/* 메인 이미지 */

.visual{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:30px;
}

.visual img{
    width:100%;
    max-width:340px;
    display:block;
}

/* 페이지 인디케이터 */

.page{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:28px 0 36px;
}

.page span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#D9DCE6;
}

.page span:nth-child(2){
    background:#5A74C8;
}

/* 버튼 */

button{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#5A74C8;
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#4965BF;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="title">
        <h1>
            차박에 필요한 물품들을 용도별로 둘러봐요
        </h1>
    </div>

    <div class="visual">
        <img src="./work 2 ill .svg" alt="온보딩2">
    </div>

    <div class="page">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <a href="./login_.html"><button>시작하기</button></a>

</div>
<script>

window.onload = function () {

    setTimeout(function () {

        window.location.href = "onboard_3.html";

    }, 3000);

};

</script>
</body>
</html>
