<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 스타일변경 메서드</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <h1>[ jQuery 스타일변경 메서드 ]</h1>

    <ol>
        <li>$('대상').css();</li>
        <li>$('대상').show();</li>
        <li>$('대상').hide();</li>
        <li>$('대상').toggle();</li>
        <li>$('대상').width();</li>
        <li>$('대상').height();</li>
    </ol>

    <div class="buttons">
        <button class="showBtn">Show</button>
        <button class="hideBtn">Hide</button>
        <button class="toggleBtn">Toggle</button>
        <button class="bigBtn">Big</button>
        <button class="smallBtn">Small</button>
    </div>

    <hr>

    <div class="box-wrap">

        <div class="box box1">
            Show / Hide
        </div>

        <div class="box box2">
            Toggle
        </div>

        <div class="box box3">
            Width / Height
        </div>

    </div>

    <script src="./js/script.js"></script>

</body>
</html>
