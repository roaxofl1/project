<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYBLE Onboarding 02</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:#fff;
}

.wrap{
    width:100%;
    max-width:390px;
    margin:0 auto;
    padding:70px 24px 40px;
    text-align:center;
}

h1{
    font-size:26px;
    font-weight:700;
    color:#1D2433;
    line-height:1.45;
}

p{
    margin-top:22px;
    font-size:16px;
    color:#6B7280;
    line-height:1.8;
}

/* 메인 일러스트 */

.visual{
    margin:48px 0 46px;
}

.visual img{
    width:88%;
    display:block;
    margin:0 auto;
}

/* 페이지 표시 */

.page{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:56px;
}

.page span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#D9D9D9;
}

.page span:nth-child(2){
    background:#2F66E8;
}

/* 버튼 */

button{
    width:100%;
    height:52px;
    border:none;
    border-radius:8px;
    background:#2F66E8;
    color:#fff;
    font-size:18px;
    font-weight:500;
    cursor:pointer;
}

button:hover{
    background:#2557d4;
}

</style>

</head>

<body>

<div class="wrap">

    <h1>
        실시간 정보로<br>
        스마트하게
    </h1>

    <p>
        날씨, 교통, 혼잡도까지 실시간으로<br>
        확인하고 더 스마트하게 여행하세요.
    </p>

    <div class="visual">
        <img src="./images/work 2 ill.svg" alt="온보딩2">
    </div>

    <div class="page">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <a href="./onboarding3.html"><button>다음</button></a>

</div>
<script>

setTimeout(function(){

    window.location.href = "onboarding3.html";

},3000);

</script>
</body>
</html>
