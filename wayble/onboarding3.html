<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYBLE Onboarding 03</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:#fff;
}

.wrap{
    width:100%;
    max-width:390px;
    margin:0 auto;
    padding:70px 24px 40px;
    text-align:center;
}

h1{
    font-size:26px;
    font-weight:700;
    color:#1D2433;
    line-height:1.45;
}

p{
    margin-top:22px;
    font-size:16px;
    color:#6B7280;
    line-height:1.8;
}

/* 메인 카드 */

.card{
    width:200px;
    margin:40px auto 55px;
    background:#fff;
    border:8px solid #EDF3FF;
    border-radius:18px;
    padding:18px 16px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    text-align:left;
}

.day{
    font-size:22px;
    font-weight:700;
    color:#2F66E8;
    margin-bottom:18px;
}

.list{
    list-style:none;
}

.list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 0;
    font-size:16px;
    font-weight:600;
    color:#1D2433;
}

.list li+li{
    border-top:1px solid #ECECEC;
}

.check{
    width:22px;
    height:22px;
    border-radius:6px;
    background:#EDF4FF;
    color:#2F66E8;
    font-size:15px;
    font-weight:700;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 페이지 인디케이터 */

.page{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:56px;
}

.page span{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#D9D9D9;
}

.page span:nth-child(3){
    background:#2F66E8;
}

/* 버튼 */

button{
    width:100%;
    height:52px;
    border:none;
    border-radius:8px;
    background:#2F66E8;
    color:#fff;
    font-size:18px;
    font-weight:500;
    cursor:pointer;
}

button:hover{
    background:#2557D4;
}

</style>

</head>

<body>

<div class="wrap">

    <h1>
        여행의 모든 순간을<br>
        기록하고 관리하세요
    </h1>

    <p>
        일정 관리부터 예약, 체크리스트까지<br>
        여행 준비를 한 곳에서.
    </p>

    <div class="card">

        <div class="day">DAY 1</div>

        <ul class="list">

            <li>
                <div class="check">✓</div>
                항공권 예약
            </li>

            <li>
                <div class="check">✓</div>
                호텔 체크인
            </li>

            <li>
                <div class="check">✓</div>
                맛집 탐방
            </li>

            <li>
                <div class="check">✓</div>
                액티비티 예약
            </li>

        </ul>

    </div>

    <div class="page">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <a href="./login.html"><button>시작하기</button></a>

</div>

</body>
</html>
