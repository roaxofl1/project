<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAYBLE Onboarding</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Pretendard,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    background:#f5f5f5;
}

.mobile{

    width:390px;
    height:100svh;
    background:#ffffff;

    display:flex;
    flex-direction:column;

    overflow:hidden;

}

.contents{

    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:0 32px;

}

.title{

    font-size:28px;
    font-weight:700;
    color:#20232C;

    text-align:center;

    line-height:1.45;

    margin-bottom:24px;

}

.desc{

    font-size:18px;
    color:#5B6472;

    text-align:center;

    line-height:1.8;

    margin-bottom:52px;

}

.desc span{

    display:block;

}

.image{

    width:255px;

    margin-bottom:54px;

}

.image img{

    width:100%;
    display:block;

}

.indicator{

    display:flex;
    gap:10px;

}

.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#D6D6D6;

}

.dot.active{

    background:#3465E6;

}

.bottom{

    padding:24px;

}

button{

    width:100%;
    height:52px;

    border:none;

    border-radius:10px;

    background:#3465E6;

    color:#fff;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

}

button:hover{

    background:#2E5DDD;

}

</style>

</head>

<body>

<div class="mobile">

    <div class="contents">

        <div class="title">

            나에게 딱 맞는<br>
            여행을 찾아드려요

        </div>

        <div class="desc">

            <span>AI가 당신의 취향과 성향을 분석해</span>
            <span>완벽한 여행을 제안드려요.</span>

        </div>

        <div class="image">

            <img src="./images/work 1 ill.svg" alt="온보딩">

        </div>

        <div class="indicator">

            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>

        </div>

    </div>

    <div class="bottom">

        <button onclick="location.href='onboarding2.html'">

            다음

        </button>

    </div>

</div>
<script>

setTimeout(() => {

    location.href = "onboarding2.html";

}, 3000);

</script>
</body>
</html>
