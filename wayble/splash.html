<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WAYBLE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    background:#f5f5f5;
    font-family:Pretendard, sans-serif;
}

.mobile{

    width:390px;
    height:100svh;
    overflow:hidden;
    position:relative;

}

.bg{

    position:absolute;
    inset:0;

    background:
    linear-gradient(
    to bottom,
    rgba(180,210,255,.45),
    rgba(255,255,255,0) 45%,
    rgba(255,255,255,.05));

    z-index:2;

}

.bg img{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-1;

}

.contents{

    position:absolute;

    top:150px;
    left:0;
    right:0;

    text-align:center;

    z-index:10;

}

.logo{

    font-size:72px;
    font-weight:900;
    color:#0D4CFF;
    letter-spacing:-2px;
    line-height:1;

}

.logo span{

    font-size:46px;
    vertical-align:top;
    margin-left:2px;

}

.title{

    margin-top:48px;

    font-size:28px;
    font-weight:700;
    line-height:1.45;
    color:#20232C;

}

.title b{

    color:#2E66FF;

}

</style>

</head>

<body>

<div class="mobile">

    <div class="bg">

        <img src="./images/sp1.png" alt="background">

    </div>

    <div class="contents">

        <div class="logo">

            WAYBLE<span>+</span>

        </div>

        <div class="title">

            고르고, 바로 떠나는<br>

            <b>나만의 여행</b>

        </div>

    </div>

</div>
<script>

setTimeout(() => {

    location.href = "onboarding1.html";

}, 3000);

</script>
</body>
</html>
