<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYBLE Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Pretendard","Noto Sans KR",sans-serif;
}

body{
    background:#fff;
}

.wrap{
    width:100%;
    max-width:390px;
    margin:0 auto;
    padding:90px 24px 40px;
}

.logo{
    text-align:center;
    font-size:54px;
    font-weight:800;
    color:#2358F3;
    letter-spacing:2px;
}

.title{
    text-align:center;
    margin-top:28px;
}

.title h2{
    font-size:22px;
    color:#222;
    margin-bottom:8px;
}

.title p{
    font-size:16px;
    color:#666;
}

.form{
    margin-top:36px;
}

.form input{
    width:100%;
    height:48px;
    margin-bottom:14px;
    padding:0 16px;
    border:1px solid #E5E7EB;
    border-radius:10px;
    font-size:14px;
    outline:none;
}

.form input:focus{
    border-color:#2F66E8;
}

.option{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:8px 2px 26px;
    font-size:13px;
    color:#666;
}

.option label{
    display:flex;
    align-items:center;
    gap:6px;
}

button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#2F66E8;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.or{
    display:flex;
    align-items:center;
    margin:38px 0;
    color:#999;
    font-size:14px;
}

.or::before,
.or::after{
    content:"";
    flex:1;
    height:1px;
    background:#E5E5E5;
}

.or span{
    margin:0 15px;
}

/* SNS 로그인 */

.sns{
    display:flex;
    justify-content:center;
    gap:24px;
    margin-bottom:40px;
}

.sns a{
    width:62px;
    height:62px;
    border:1px solid #E5E5E5;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
}

.sns img{
    width:30px;
    height:30px;
    object-fit:contain;
}

.join{
    text-align:center;
    font-size:16px;
    color:#333;
}

.join a{
    color:#2F66E8;
    text-decoration:none;
    font-weight:600;
    margin-left:5px;
}

</style>

</head>

<body>

<div class="wrap">

    <div class="logo">WAYBLE</div>

    <div class="title">
        <h2>환영합니다!</h2>
        <p>로그인하고 계속하세요.</p>
    </div>

    <div class="form">

        <input type="email" placeholder="이메일 주소">

        <input type="password" placeholder="비밀번호">

    </div>

    <div class="option">

        <label>
            <input type="checkbox">
            로그인 상태 유지
        </label>

        <span>비밀번호 찾기</span>

    </div>

    <a href="wayblemain.html"><button>로그인</button></a>

    <div class="or">
        <span>또는</span>
    </div>

    <div class="sns">

        <a href="#">
            <img src="./images/apple.png" alt="Apple">
        </a>

        <a href="#">
            <img src="./images/google.png" alt="Google">
        </a>

        <a href="#">
            <img src="./images/kakakao.png" alt="Kakao">
        </a>

    </div>

    <div class="join">
        계정이 없으신가요?
        <a href="#">회원가입</a>
    </div>

</div>

</body>
</html>
