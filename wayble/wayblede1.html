<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI 여행 시작</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Pretendard,sans-serif}
body{background:#f3f3f3;display:flex;justify-content:center}
.app{width:390px;height:100svh;background:#fff;overflow-y:auto;display:flex;flex-direction:column}
header{position:sticky;top:0;height:56px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eee;z-index:10}
header h1{font-size:18px;font-weight:700;color:#1f2430}
.back{position:absolute;left:16px;border:none;background:none;cursor:pointer}
.back img{width:24px;height:24px}
.content{flex:1;padding:42px 24px 24px;display:flex;flex-direction:column;align-items:center}
.title{font-size:28px;font-weight:800;line-height:1.35;text-align:center;color:#1f2430}
.desc{margin-top:18px;font-size:16px;line-height:1.8;text-align:center;color:#5b6473}
.illust{width:270px;margin:42px 0 48px}
.start{margin-top:auto;width:100%;height:46px;border:none;border-radius:8px;background:#3367e8;color:#fff;font-size:18px;cursor:pointer}
nav{position:sticky;bottom:0;height:72px;border-top:1px solid #ddd;background:#fff;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#222;font-size:12px}
nav img{width:22px;margin-bottom:4px}
.active{color:#2f62e8;font-weight:700}
</style>
</head>
<body>
<div class="app">

<header>
<button class="back" onclick="history.back()">
<img src="./icons/line-md_arrow-left.svg" alt="이전">
</button>
<h1>AI 여행 시작</h1>
</header>

<div class="content">

<div class="title">
어떤 여행을<br>
원하시나요?
</div>

<div class="desc">
몇 가지 질문으로 당신에게 딱 맞는<br>
여행을 추천해드릴게요.
</div>

<img class="illust" src="./images/ai moon.svg" alt="AI 일러스트">

<button class="start" onclick="location.href='wayblede2.html'">
시작하기
</button>

</div>

<nav>
<a href="wayblemain.html"><img src="./icons/iconamoon_home-light.svg">홈</a>
<a href="wayblesearch.html"><img src="./icons/iconamoon_search-light.svg">검색</a>
<a href="wayblelist.html"><img src="./icons/solar_heart-linear.svg">저장</a>
<a href="waybletravle.html" class="active"><img src="./icons/coloricons/blue streamline-flex_suitcase-rolling.svg">여행</a>
<a href="wayblemy.html"><img src="./icons/mynaui_user.svg">MY</a>
</nav>

</div>
</body>
</html>
