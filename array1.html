<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <script>
        // 배열을 사용하지 않음
        let fruit1 = "바나나"
        let fruit2 = "포도"
        let fruit3 = "수박"
        document.write("올해의 제철 과일은 " + fruit1 + fruit2 + fruit3 + "입니다<br>")

        // 백틱 사용 
        document.write(`올해의 제철 과일은 ${fruit1},${fruit2},${fruit3} 입니다.<br>`)
        
        // 배열을 사용함
        let fruit= ["바나나" , "포도" , "수박"]
        document.write(`오늘의 추천 과일은 ${fruit[2]} 입니다!<br>`)

        // 월,화,수,목,금,토,일
        let day1="월"
        let day2="화"
        let day3="수"
        let day4="목"
        let day5="금"
        let day6="토"
        let day7="일"

        document.write(`오늘은 ${day2}요일 입니다!<br>`)
        document.write(`내일은 ${day3}요일 입니다!<br>`)
        
        let week = ["월","화","수","목","금","토","일"]
        document.write(`오늘은 ${week[1]}요일 입니다!<br>`)
        document.write(`내일은 ${week[2]}요일 입니다!`)
        console.log(week)
        alert(week[5])

    </script>
</body>
</html>
