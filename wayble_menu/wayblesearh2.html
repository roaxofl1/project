<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Pretendard,sans-serif}
body{background:#f3f3f3;display:flex;justify-content:center}
.app{width:390px;height:100svh;background:#fff;overflow-y:auto}
header{position:sticky;top:0;height:88px;background:#fff;border-bottom:1px solid #e9e9e9;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;z-index:5}
.back{position:absolute;left:16px;bottom:16px;border:none;background:none}
.back img{width:24px}
header h1{font-size:18px;font-weight:700}
.list{padding-bottom:84px}
.item{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid #ececec}
.thumb{width:96px;height:96px;border-radius:8px;object-fit:cover}
.info{flex:1}
.title{font-size:18px;font-weight:700;color:#222;line-height:1.4}
.date{margin-top:6px;font-size:14px;color:#586272}
nav{position:sticky;bottom:0;height:72px;border-top:1px solid #ddd;background:#fff;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:#222;font-size:12px}
nav img{width:22px;margin-bottom:4px}
.active{color:#2f62e8;font-weight:700}
</style>
</head>
