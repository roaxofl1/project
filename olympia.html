<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympiad</title>
    <style>
        *{margin: 0;padding: 0;}
        div{width: 640px;padding: 42px 15px 16px;
        border: 2px solid red; margin: auto;}
        h1{background-color: yellow; text-align: center; 
            padding: 16px; margin-bottom: 24px;}
        .p1{color: blue; margin-bottom: 21px; font-size: 21px;}
        .p2{font-size: 21px; font-weight: 600; margin-bottom: 21px;}
        h2{background-color: #d3d3d3; text-align: center; padding: 16px 0px;
        font-weight: 500; margin-bottom: 24px;}
        ul{margin-left: 42px; margin-bottom: 42px;}
        .p3{font-size: 13px; font-weight: 700;margin-bottom: 45px;}
        span{background-color: #7f0081; color: white; padding: 6px;}

    </style>
</head>
<body>
    <div>
        <h1>한국 영재 올림피아드</h1>
        <p class="p1">한국 영재 올림피아드(Korea Olympiad for the Gifted Studentes)는...</p>
        <p class="p2">(&UpArrow; 클릭하면 자세한 설명으로 이동합니다.)</p>
        <h2>대회 개요</h2>
        <ul>
            <li>대회 일시</li>
            <li>대회 일시</li>
            <li>대회 일시</li>
        </ul>
        <p class="p3">한국 영재 올림피아드에 참가하는 학생 여러분들을 진심으로 환영하며
            격려를 아끼지 않습니다.
        </p>
        <p class="p3">과학에 관심있고 재능있는 여러분들의 도전을 응원하겠습니다!!</p>
        <p>
            <span>이벤트</span>
            <span>이벤트</span>
            <span>이벤트</span>
        </p>
    </div>
</body>
</html>
