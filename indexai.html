<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>서울아산병원</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/mainai.css">
</head>

<body>

    <!-- ================= Header ================= -->

    <header class="header">

        <button class="menu-btn">
            <img src="./images/bg_header_lnb.png" alt="메뉴">
        </button>

        <h1 class="logo">
            <img src="./images/logo.png" alt="서울아산병원">
        </h1>

        <button class="search-btn">
            <img src="./images/img_topSerch.png" alt="검색">
        </button>

    </header>


    <!-- ================= Main Banner ================= -->

    <section class="main-banner">

        <div class="swiper bannerSwiper">

            <div class="swiper-wrapper">

                <!-- slide01 -->
                <div class="swiper-slide">
                    <img src="./images/1.png" alt="메인배너">
                </div>

                <!-- slide02 -->
                <div class="swiper-slide">
                    <img src="./images/2.png" alt="2번쨰배너">
                </div>

                <!-- slide03 -->
                <div class="swiper-slide">
                    <img src="./images/333.jpg" alt="세번째배너">
                </div>

            </div>


            <!-- pagination -->
            <div class="swiper-pagination"></div>

            <!-- navigation -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

        </div>

    </section>



    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- JS -->
    <script src="./js/mainai.js"></script>

</body>
</html>
